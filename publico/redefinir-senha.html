<!doctype html>
<html lang="pt-BR" class="no-js" data-tema="escuro">
<head>
  <!-- incluir:cabeca -->
  <title>Criar senha nova | Barbearia do Fortão</title>
  <meta name="description" content="Crie uma senha nova para sua conta.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/paginas.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <!-- incluir:topo -->
  <main id="conteudo" class="auth container">
    <aside class="auth__foto" aria-hidden="true"><img src="/img/cena-navalha.svg" alt="" width="900" height="1200"><p>Disciplina é o meu superpoder.</p></aside>
    <section class="auth__caixa" aria-labelledby="titulo">
      <h1 class="titulo-pagina" id="titulo">Criar senha nova</h1>
      <p class="subtitulo">Escolha uma senha forte. Depois disso, as outras sessões da sua conta são encerradas.</p>
      <form data-form="redefinir" novalidate>
        <p class="alerta alerta--erro" data-erro-geral role="alert" tabindex="-1" hidden></p>
        <div class="campo">
          <label for="senha">Senha nova</label>
          <div class="senha-caixa">
            <input id="senha" name="senha" type="password" autocomplete="new-password" required aria-describedby="senha-ajuda senha-erro" minlength="8">
            <button type="button" data-ver-senha aria-label="Mostrar senha" aria-pressed="false"><i class="ph ph-eye" aria-hidden="true"></i></button>
          </div>
          <p class="ajuda" id="senha-ajuda">Pelo menos 8 caracteres.</p>
          <p class="erro-campo" id="senha-erro" data-erro-de="senha"></p>
        </div>
        <div class="forca" data-forca data-nivel="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="campo">
          <label for="confirmar">Repita a senha</label>
          <div class="senha-caixa">
            <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required aria-describedby="confirmar-erro" >
            <button type="button" data-ver-senha aria-label="Mostrar senha" aria-pressed="false"><i class="ph ph-eye" aria-hidden="true"></i></button>
          </div>
          <p class="erro-campo" id="confirmar-erro" data-erro-de="confirmar"></p>
        </div>
        <button class="botao botao--cheio botao--bloco botao--g" type="submit">Salvar senha nova</button>
      </form>
    </section>
  </main>
  <!-- incluir:rodape -->
  <!-- incluir:abas -->
</body>
</html>
