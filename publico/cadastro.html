<!doctype html>
<html lang="pt-BR" class="no-js" data-tema="escuro">
<head>
  <!-- incluir:cabeca -->
  <title>Criar conta | Barbearia do Fortão</title>
  <meta name="description" content="Crie sua conta na Barbearia do Fortão e marque seu corte em poucos toques.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="/css/paginas.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <!-- incluir:topo -->
  <main id="conteudo" class="auth container">
    <aside class="auth__foto" aria-hidden="true"><img src="/img/cena-navalha.svg" alt="" width="900" height="1200"><p>Cabelo na régua, mente no lugar.</p></aside>
    <section class="auth__caixa" aria-labelledby="titulo">
      <h1 class="titulo-pagina" id="titulo">Criar conta</h1>
      <p class="subtitulo">Leva menos de um minuto. Depois é só marcar e receber o lembrete.</p>
      <form data-form="cadastro" novalidate>
        <p class="alerta alerta--erro" data-erro-geral role="alert" tabindex="-1" hidden></p>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="name" aria-describedby="nome-erro" required maxlength="120">
          <p class="erro-campo" id="nome-erro" data-erro-de="nome"></p>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-ajuda email-erro" inputmode="email" required>
          <p class="ajuda" id="email-ajuda">A confirmação e os lembretes chegam aqui.</p>
          <p class="erro-campo" id="email-erro" data-erro-de="email"></p>
        </div>
        <div class="campo">
          <label for="telefone">WhatsApp (opcional)</label>
          <input id="telefone" name="telefone" type="tel" autocomplete="tel" aria-describedby="telefone-ajuda telefone-erro" inputmode="tel" placeholder="(11) 91234-5678">
          <p class="ajuda" id="telefone-ajuda">Só para a barbearia falar com você sobre o horário.</p>
          <p class="erro-campo" id="telefone-erro" data-erro-de="telefone"></p>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="senha-caixa">
            <input id="senha" name="senha" type="password" autocomplete="new-password" required aria-describedby="senha-ajuda senha-erro" minlength="8">
            <button type="button" data-ver-senha aria-label="Mostrar senha" aria-pressed="false"><i class="ph ph-eye" aria-hidden="true"></i></button>
          </div>
          <p class="ajuda" id="senha-ajuda">Pelo menos 8 caracteres. Evite datas e sequências.</p>
          <p class="erro-campo" id="senha-erro" data-erro-de="senha"></p>
        </div>
        <div class="forca" data-forca data-nivel="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <label class="marcar"><input type="checkbox" name="aceite" required aria-describedby="aceite-erro"><span>Li e aceito os <a href="/termos" target="_blank">termos de uso</a> e a <a href="/privacidade" target="_blank">política de privacidade</a>.</span></label>
        <p class="erro-campo" id="aceite-erro" data-erro-de="aceite"></p>
        <label class="marcar"><input type="checkbox" name="marketing"><span>Quero receber novidades e promoções da barbearia por e-mail. Opcional, dá para mudar depois.</span></label>
        <button class="botao botao--cheio botao--bloco botao--g" type="submit">Criar conta</button>
      </form>
      <p class="auth__troca">Já tem conta? <a class="link" href="/entrar" data-manter-volta>Entrar</a></p>
    </section>
  </main>
  <!-- incluir:rodape -->
  <!-- incluir:abas -->
</body>
</html>
