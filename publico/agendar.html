<!doctype html>
<html lang="pt-BR" class="no-js" data-tema="escuro">
<head>
  <!-- incluir:cabeca -->
  <title>Marcar horário | Barbearia do Fortão</title>
  <meta name="description" content="Escolha o serviço, o dia e o horário na Barbearia do Fortão. Confirmação na hora e lembrete antes do corte.">
  <link rel="stylesheet" href="/css/agenda.css">
  <link rel="stylesheet" href="/css/paginas.css">
  <script type="module" src="/js/agendar.js"></script>
</head>
<body>
  <!-- incluir:topo -->
  <main id="conteudo" class="container pagina pagina--agendar">
    <header class="pagina__cabeca agendar-capa">
      <picture class="agendar-capa__foto">
        <source type="image/webp" srcset="/img/capa-corte-480.webp 480w, /img/capa-corte-768.webp 768w, /img/capa-corte-1024.webp 1024w" sizes="(min-width: 900px) 400px, calc(100vw - 32px)">
        <img src="/img/capa-corte.jpg" alt="Barbeiro de avental passando a máquina no cabelo de um cliente, com palmeiras e a cidade pela janela da barbearia." width="1024" height="1536" fetchpriority="high">
      </picture>
      <div class="agendar-capa__texto">
        <h1 class="titulo-pagina">Marcar horário</h1>
        <p class="subtitulo" data-agendar-sub>Serviço, dia e horário. Você vê o valor antes de confirmar e paga na barbearia.</p>
      </div>
    </header>
    <div class="alerta" data-agendar-aviso hidden></div>
    <div data-agendamento></div>
  </main>

</html>
