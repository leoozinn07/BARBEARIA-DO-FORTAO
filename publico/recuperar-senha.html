<!doctype html>
<html lang="pt-BR" class="no-js" data-tema="escuro">
<head>
  <!-- incluir:cabeca -->
  <title>Esqueci a senha | Barbearia do Fortão</title>
  <meta name="description" content="Receba um link para criar uma senha nova.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/paginas.css">
  <script type="module" src="/js/auth.js"></script>
</head>
<body>
  <!-- incluir:topo -->
  <main id="conteudo" class="auth container">
    <aside class="auth__foto" aria-hidden="true"><img src="/img/cena-navalha.svg" alt="" width="900" height="1200"><p>Corre pelo seu.</p></aside>
    <section class="auth__caixa" aria-labelledby="titulo">
      <h1 class="titulo-pagina" id="titulo">Esqueci a senha</h1>
      <p class="subtitulo">Informe o e-mail da sua conta. Mandamos um link para criar uma senha nova.</p>
      <form data-form="recuperar" novalidate>
        <p class="alerta alerta--erro" data-erro-geral role="alert" tabindex="-1" hidden></p>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-erro" inputmode="email" required>
          <p class="erro-campo" id="email-erro" data-erro-de="email"></p>
        </div>
        <button class="botao botao--cheio botao--bloco botao--g" type="submit">Enviar link</button>
      </form>
      <div class="resultado" data-resultado hidden>
        <p class="alerta alerta--ok"><i class="ph-fill ph-check-circle" aria-hidden="true"></i><span data-resultado-texto></span></p>
        <p class="subtitulo">Não chegou? Olhe a caixa de spam ou tente de novo em alguns minutos.</p>
      </div>
      <p class="auth__troca">Lembrou? <a class="link" href="/entrar">Entrar</a></p>
    </section>
  </main>
  <!-- incluir:rodape -->
  <!-- incluir:abas -->
</body>
</html>
