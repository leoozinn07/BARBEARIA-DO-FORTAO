# Sobe o site e o Caddy (HTTPS automático com Let's Encrypt) em um servidor. O banco é o Supabase.
# Uso: copie .env.example para .env, preencha, coloque o certificado do Supabase em certs/ e rode `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./certs:/app/certs:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env (ex.: barbeariadofortao.com.br)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dados-caddy:/data
    depends_on:
      - app

volumes:
  dados-caddy:
